# Release pipeline for the gurupras/scip-clang fork.
#
# Upstream's release workflow runs on Sourcegraph's paid runners and needs
# Sourcegraph's Google Cloud secrets, so it cannot run here. This version uses
# GitHub's free runners only:
#
#   - push to an alx/** branch  -> build both platforms, no release
#   - push of a v* tag          -> build both platforms, then publish a GitHub
#                                  release with the binaries, LICENSE and
#                                  SHA256SUMS
#   - workflow_dispatch         -> build the dispatched ref (publishes only if
#                                  that ref is a v* tag)
#
# The binaries are built with --config=release, the same config used for the
# hand-built v0.4.0-alx.1 binary. The release notes come from the tag's
# "## v<version>" section of CHANGELOG.md.
name: Release
on:
  push:
    branches:
      - "alx/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: "Build (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux x86_64: 4 cores, 16 GB RAM
          - platform: "ubuntu-24.04"
            bazel_mem: "4g"
            bazel_jobs: "4"
          # darwin arm64: 3 cores, 7 GB RAM
          - platform: "macos-14"
            bazel_mem: "3g"
            bazel_jobs: "3"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: "Check version"
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            NEW_VERSION="${REF#refs/tags/v}"
          else
            NEW_VERSION="$(sed -n 's/^#define VERSION "\(.*\)"$/\1/p' indexer/Version.h)"
          fi
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::could not determine the version"
            exit 1
          fi
          echo "Checking version $NEW_VERSION"
          NEW_VERSION="$NEW_VERSION" ./tools/version_check.sh

      - name: "Free disk space"
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: "Install Bazelisk"
        run: |
          set -euo pipefail
          if ! command -v bazelisk && ! command -v bazel; then
            if [ "$RUNNER_OS" == "Linux" ]; then
              sudo curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64 -o /usr/local/bin/bazel
              sudo chmod +x /usr/local/bin/bazel
            else
              brew install bazelisk
            fi
          fi
          bazel --version  # .bazelversion pins 7.5.0

      - name: "Build scip-clang"
        env:
          BAZEL_MEM: ${{ matrix.bazel_mem }}
          BAZEL_JOBS: ${{ matrix.bazel_jobs }}
        run: |
          set -euo pipefail
          # ci.bazelrc is try-imported by .bazelrc and gitignored.
          {
            echo "startup --host_jvm_args=-Xmx$BAZEL_MEM"
            echo "build --jobs=$BAZEL_JOBS"
            echo "build --local_ram_resources=HOST_RAM*.5"
          } > ci.bazelrc
          cat ci.bazelrc
          bazel build //indexer:scip-clang --config=release
          df -h

      - name: "Package binary"
        run: |
          set -euo pipefail
          out="scip-clang-$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]')"
          cp bazel-bin/indexer/scip-clang "$out"
          chmod +x "$out"
          echo "BINARY=$out" >> "$GITHUB_ENV"

      - name: "Summarize binary"
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then
            sha="$(sha256sum "$BINARY" | cut -d ' ' -f 1)"
          else
            sha="$(shasum -a 256 "$BINARY" | cut -d ' ' -f 1)"
          fi
          version="$("./$BINARY" --version | tr '\n' ' ' | sed 's/ *$//')"
          glibc="n/a"
          if [ "$RUNNER_OS" == "Linux" ]; then
            glibc="$(objdump -T "$BINARY" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)"
          fi
          {
            echo "### $BINARY"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| sha256 | \`$sha\` |"
            echo "| --version | $version |"
            echo "| glibc floor | $glibc |"
            echo "| size | $(wc -c < "$BINARY" | tr -d ' ') bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$BINARY::sha256=$sha; version=$version; glibc floor=$glibc"

      - name: "Upload binary"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}
          if-no-files-found: error

  release:
    name: "Create release"
    needs: build
    # always() so a macOS failure does not block publishing the Linux binary.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Download binaries"
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: "Assemble release files"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f dist/scip-clang-x86_64-linux ]; then
            echo "::error::dist/scip-clang-x86_64-linux is missing; the Linux build did not succeed"
            exit 1
          fi
          if [ ! -f dist/scip-clang-arm64-darwin ]; then
            echo "::warning::dist/scip-clang-arm64-darwin is missing; releasing without the macOS binary"
          fi
          chmod +x dist/scip-clang-*
          cp LICENSE dist/LICENSE
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

          glibc="$(objdump -T dist/scip-clang-x86_64-linux | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)"
          version="${TAG#v}"
          # The "## v<version>" CHANGELOG section, up to the next "## " heading.
          awk -v hdr="## v$version" '
            index($0, hdr) == 1 && (length($0) == length(hdr) || substr($0, length(hdr) + 1, 1) == " ") { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes
          if ! grep -q '[^[:space:]]' notes; then
            echo "::error::no '## v$version' section found in CHANGELOG.md"
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Built on GitHub Actions with \`bazel build //indexer:scip-clang --config=release\`."
            echo "The Apache-2.0 LICENSE is attached; SHA256SUMS covers every file."
            echo "The linux build requires glibc >= $glibc."
          } >> notes
          cat notes

      - name: "Publish release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "scip-clang $TAG" --notes-file notes dist/*
